<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<div class="topbar">
  <h2>Change Password</h2>
  <a href="dashboard.html" class="logout-btn">Back</a>
</div>

<div class="module-box">
  <div id="saveMsg" class="success" style="display:none; margin-bottom:15px;">Password updated successfully!</div>

  <form onsubmit="handleUpdate(event)">
    <input type="password" id="password" name="password" class="input-box" placeholder="New Password" required>
    <button class="green-btn" type="submit" name="update">Update Password</button>
  </form>
</div>

<script>
function handleUpdate(e) {
  e.preventDefault();
  const p = document.getElementById('password').value;
  if (p) {
    const msg = document.getElementById('saveMsg');
    msg.style.display = 'block';
    setTimeout(() => {
      msg.style.display = 'none';
      window.location.href = 'dashboard.html';
    }, 1500);
  }
}
</script>

</body>
</html>
