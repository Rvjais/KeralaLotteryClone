<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Admin Portal Login — Kerala Lottery</title>
<link href="_external/fonts.googleapis.com/css2_724c00e0.css" rel="stylesheet"/>
<link href="_external/cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
:root {
  --emerald-950: #041408;
  --emerald-900: #082410;
  --emerald-800: #134622;
  --gold-300: #f7e070;
  --gold-400: #f5cf38;
  --gold-500: #d4af37;
  --gold-glow: rgba(212, 175, 55, 0.4);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #031206 0%, #082410 50%, #041408 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 40%, rgba(212, 175, 55, 0.08), transparent 50%),
              radial-gradient(circle at 80% 20%, rgba(68, 191, 102, 0.08), transparent 50%);
  pointer-events: none;
}

.login-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 20px;
  padding: 42px 36px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 2;
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
}

.logo-area {
  text-align: center;
  margin-bottom: 28px;
}

.logo-wrap {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, var(--gold-400), #b89225);
  box-shadow: 0 0 18px var(--gold-glow);
  margin: 0 auto 14px;
}

.logo-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: var(--emerald-950);
}

.logo-area h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 1.25rem;
  color: var(--gold-400);
  font-weight: 700;
  line-height: 1.2;
}

.logo-area p {
  color: rgba(255, 255, 255, 0.55);
  font-size: 0.72rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 4px;
  font-weight: 500;
}

.err {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: #fca5a5;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.82rem;
  margin-bottom: 18px;
  display: none;
  align-items: center;
  gap: 8px;
}

.grp {
  margin-bottom: 18px;
}

.grp label {
  display: block;
  color: rgba(255, 255, 255, 0.75);
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.inp-w {
  position: relative;
}

.inp-w i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold-400);
  font-size: 0.9rem;
}

.inp {
  width: 100%;
  padding: 13px 14px 13px 42px;
  background: rgba(255, 255, 255, 0.08);
  border: 2px solid rgba(212, 175, 55, 0.25);
  border-radius: 10px;
  color: #ffffff;
  font-size: 0.9rem;
  font-family: 'Poppins', sans-serif;
  outline: none;
  transition: all 0.3s ease;
}

.inp::placeholder {
  color: rgba(255, 255, 255, 0.3);
}

.inp:focus {
  border-color: var(--gold-400);
  background: rgba(212, 175, 55, 0.08);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #ffd700 0%, #f5af19 100%);
  color: var(--emerald-950);
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: all 0.3s ease;
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 20px rgba(245, 175, 25, 0.4);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(245, 175, 25, 0.6);
  background: linear-gradient(135deg, #ffe033 0%, #f5b82e 100%);
}

.hint {
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.22);
  border-radius: 10px;
  padding: 10px 14px;
  color: rgba(255, 255, 255, 0.65);
  font-size: 0.74rem;
  text-align: center;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.hint b {
  color: var(--gold-300);
}

.back {
  text-align: center;
  margin-top: 20px;
}

.back a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: rgba(255, 255, 255, 0.55);
  font-size: 0.82rem;
  text-decoration: none;
  transition: all 0.3s ease;
}

.back a:hover {
  color: var(--gold-300);
  transform: translateX(-3px);
}

@media (max-width: 480px) {
  .login-card {
    padding: 32px 20px;
  }
}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-area">
    <div class="logo-wrap">
      <img alt="Kerala Lottery Seal" onerror="this.src='https://ui-avatars.com/api/?name=KL&background=041408&color=d4af37'" src="assets/images/logo.png"/>
    </div>
    <h1>Kerala Lottery</h1>
    <p>Official Directorate Admin Portal</p>
  </div>

  <div class="err" id="errMsg">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span id="errTxt">Invalid credentials. Please verify your username and password.</span>
  </div>

  <form autocomplete="off" id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
    <div class="grp">
      <label><i class="fa-solid fa-user-shield"></i> Admin Username</label>
      <div class="inp-w">
        <i class="fa-solid fa-user"></i>
        <input class="inp" id="username" name="username" placeholder="Enter authorized username" required="" type="text" value="admin"/>
      </div>
    </div>
    <div class="grp">
      <label><i class="fa-solid fa-key"></i> Security Password</label>
      <div class="inp-w">
        <i class="fa-solid fa-lock"></i>
        <input class="inp" id="password" name="password" placeholder="Enter administrative password" required="" type="password" value="admin123"/>
      </div>
    </div>
    <button class="btn" type="submit">
      <i class="fa-solid fa-right-to-bracket"></i> Login to Directorate Console
    </button>
  </form>

  <div class="hint">
    <i class="fa-solid fa-shield-halved"></i>
    <span>Secure 256-Bit Authorized Access Only</span>
  </div>
  <div class="back">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Return to Main Public Website</a>
  </div>
</div>

<script>
function handleLoginSubmit(e) {
  e.preventDefault();
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value.trim();

  if (!u || !p) {
    var err = document.getElementById('errMsg');
    err.style.display = 'flex';
    document.getElementById('errTxt').textContent = 'Please provide both username and password.';
    return;
  }

  // Set auth session
  sessionStorage.setItem('kl_admin_auth', '1');
  localStorage.setItem('kl_admin_auth', '1');
  sessionStorage.setItem('kl_admin_user', u);

  // Redirect to Admin Dashboard
  window.location.href = 'admin-dashboard.html';
}
</script>
</body>
</html>
